{% load static %}
<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script>
            (function () {
                var stored = null;
                try { stored = localStorage.getItem('theme'); } catch (e) {}
                var dark = stored === 'dark' ||
                    (stored === null && window.matchMedia &&
                     window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) {
                    document.documentElement.classList.add('dark');
                }
            })();
        </script>
        <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
        <link rel="stylesheet" href="{% static 'css/pygments.css' %}">
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
        <link rel="alternate" type="application/rss+xml" title="RSS" href="{% url 'rss' %}">
        <title>{% block title %}多于点线圈-blog{% endblock %}</title>
    </head>
    <body class="min-h-screen flex flex-col font-sans antialiased text-neutral-800 dark:text-neutral-200">
        <header class="sticky top-0 z-10 border-b border-white/40 dark:border-white/10 glass !rounded-none border-x-0 border-t-0">
            <div class="mx-auto flex max-w-4xl flex-wrap items-center justify-between gap-3 px-4 py-3">
                <a href="{% url 'post_list' %}" class="text-lg font-semibold text-brand hover:text-brand-dark">
                    多于点线圈
                </a>
                <div class="flex items-center gap-2">
                    <div data-react="gooey-nav" data-path="{{ request.path }}"></div>
                    <div data-react="theme-toggle" class="ml-1"></div>
                </div>
            </div>
        </header>

        <main class="mx-auto w-full max-w-4xl flex-1 px-4 py-8">
            {% block content %}{% endblock %}
        </main>

        <footer class="glass !rounded-none border-x-0 border-b-0 py-6 text-center text-sm text-neutral-600 dark:text-neutral-300">
            <p>&copy; 2026 多于点线圈</p>
            {# 只留 RSS：Sitemap 是给爬虫看的，已通过 /robots.txt 指向它 #}
            <p class="mt-2">
                <a href="{% url 'rss' %}" class="hover:text-brand">RSS 订阅</a>
            </p>
        </footer>

        {{ nav_items|json_script:"nav-items" }}
        <script type="module" src="{% static 'js/bundle.js' %}"></script>
    </body>
</html>
