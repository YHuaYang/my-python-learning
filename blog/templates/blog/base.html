{% load static %}
<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script>
            (function () {
                var stored = null;
                try { stored = localStorage.getItem('theme'); } catch (e) {}
                var dark = stored === 'dark' ||
                    (stored === null && window.matchMedia &&
                     window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) {
                    document.documentElement.classList.add('dark');
                }
            })();
        </script>
        <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
        <link rel="stylesheet" href="{% static 'css/pygments.css' %}">
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
        <link rel="alternate" type="application/rss+xml" title="RSS" href="{% url 'rss' %}">
        <title>{% block title %}多于点线圈-blog{% endblock %}</title>
    </head>
    <body class="min-h-screen flex flex-col bg-white text-neutral-800 font-sans antialiased dark:bg-neutral-900 dark:text-neutral-200">
        <header class="sticky top-0 z-20 border-b border-neutral-200 bg-white/95 backdrop-blur dark:border-neutral-700 dark:bg-neutral-900/95">
            <div class="mx-auto flex max-w-4xl items-center justify-between gap-3 px-4 py-3">
                <a href="{% url 'post_list' %}" class="shrink-0 text-lg font-semibold text-brand hover:text-brand-dark">
                    多于点线圈
                </a>

                <details class="group relative sm:hidden">
                    <summary class="flex h-8 w-8 cursor-pointer list-none items-center justify-center rounded-lg text-neutral-500 hover:bg-neutral-100 hover:text-brand dark:text-neutral-400 dark:hover:bg-neutral-800 [&::-webkit-details-marker]:hidden">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-5 w-5 group-open:hidden" aria-hidden="true">
                            <path d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden h-5 w-5 group-open:block" aria-hidden="true">
                            <path d="M6 6l12 12M18 6L6 18" />
                        </svg>
                        <span class="sr-only">打开导航菜单</span>
                    </summary>

                    <nav class="absolute right-0 top-full z-30 mt-2 w-44 rounded-xl border border-neutral-200 bg-white p-2 shadow-lg dark:border-neutral-700 dark:bg-neutral-900">
                        <a href="{% url 'post_list' %}" class="block rounded-lg px-3 py-2 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">首页</a>
                        <a href="{% url 'projects' %}" class="block rounded-lg px-3 py-2 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">项目</a>
                        <a href="{% url 'progress_list' %}" class="block rounded-lg px-3 py-2 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">进度</a>
                        <a href="{% url 'song_list' %}" class="block rounded-lg px-3 py-2 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">歌曲</a>
                        <a href="{% url 'search' %}" class="block rounded-lg px-3 py-2 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">搜索</a>
                        <a href="{% url 'about' %}" class="block rounded-lg px-3 py-2 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">关于</a>
                    </nav>
                </details>

                <nav class="hidden items-center gap-1 text-sm sm:flex">
                    <a href="{% url 'post_list' %}" class="rounded px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-800">首页</a>
                    <a href="{% url 'projects' %}" class="rounded px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-800">项目</a>
                    <a href="{% url 'progress_list' %}" class="rounded px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-800">进度</a>
                    <a href="{% url 'song_list' %}" class="rounded px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-800">歌曲</a>
                    <a href="{% url 'search' %}" class="rounded px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-800">搜索</a>
                    <a href="{% url 'about' %}" class="rounded px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-800">关于</a>
                </nav>

                <div data-react="theme-toggle" class="shrink-0"></div>
            </div>
        </header>

        <main class="mx-auto w-full max-w-4xl flex-1 px-4 py-6 sm:py-8">
            {% block content %}{% endblock %}
        </main>

        <footer class="border-t border-neutral-200 py-6 text-center text-sm text-neutral-500 dark:border-neutral-700 dark:text-neutral-400">
            <p>&copy; 2026 多于点线圈</p>
            <p class="mt-2">
                <a href="{% url 'rss' %}" class="hover:text-brand">RSS 订阅</a>
                <span class="mx-2 text-neutral-300 dark:text-neutral-600">|</span>
                <a href="{% url 'sitemap' %}" class="hover:text-brand">Sitemap</a>
            </p>
        </footer>

        <script type="module" src="{% static 'js/bundle.js' %}"></script>
    </body>
</html>
