{% extends "blog/base.html" %}
{% block title %}{{ post.title }} - 多于点线圈 blog{% endblock %}
{% block content %}
    <article class="max-w-3xl">
        <div class="flex items-center gap-3">
            <time class="text-sm text-neutral-500">{{ post.published_date }}</time>
            <span class="text-sm text-neutral-400">{{ post.views }} 次阅读</span>
        </div>
        <h1 class="mt-1 text-3xl font-bold leading-tight">{{ post.title }}</h1>
        <div class="mt-6 leading-loose text-neutral-700">{{ post.text|linebreaksbr }}</div>
    </article>

    <p class="mt-12">
        <a href="{% url 'post_list' %}" class="text-sm text-brand hover:underline">&larr; 返回列表</a>
    </p>
{% endblock %}
