{% for post in posts %}
    <article class="border-b border-neutral-200 pb-6 mb-6 last:border-0 last:pb-0 last:mb-0">
        <time class="text-sm text-neutral-500">{{ post.published_date }}</time>
        <h2 class="mt-1 text-2xl font-semibold leading-snug">
            <a href="{% url 'post_detail' post.slug %}" class="hover:text-brand">{{ post.title }}</a>
        </h2>
        <p class="mt-2 leading-relaxed text-neutral-600">{{ post.excerpt|default:post.text|truncatechars:100 }}</p>
    </article>
{% empty %}
    <p class="rounded-lg border border-dashed border-neutral-300 p-8 text-center text-neutral-500">
        还没有已发布的文章。
    </p>
{% endfor %}
