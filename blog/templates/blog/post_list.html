{% extends "blog/base.html" %}
{% block content %}
    {% include "blog/_posts.html" %}

    {% if categories %}
        <nav>
            <h3>分类</h3>
            {% for cat in categories %}
                <a href="{% url 'category_posts' cat.slug %}">{{ cat.name }}</a>
            {% endfor %}
        </nav>
    {% endif %}
{% endblock %}
