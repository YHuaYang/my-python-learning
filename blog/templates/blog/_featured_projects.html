{% if featured_projects %}
    <section class="rounded-xl border border-neutral-200 p-5 dark:border-neutral-700">
        <div class="flex items-baseline justify-between">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-neutral-400">项目精选</h2>
            <a href="{% url 'projects' %}" class="text-xs text-brand hover:underline">全部 &rarr;</a>
        </div>
        <ul class="mt-3 space-y-3">
            {% for project in featured_projects %}
                <li>
                    <div class="flex items-baseline justify-between gap-2">
                        <a href="{% url 'project_detail' project.slug %}" class="text-sm font-semibold hover:text-brand">{{ project.name }}</a>
                        {% if project.github_url %}
                            <a href="{{ project.github_url }}" target="_blank" rel="noopener noreferrer"
                               class="shrink-0 text-xs text-brand hover:underline">GitHub &rarr;</a>
                        {% endif %}
                    </div>
                    {% if project.summary %}
                        <p class="mt-0.5 text-xs leading-relaxed text-neutral-600 dark:text-neutral-400">{{ project.summary|truncatechars:50 }}</p>
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    </section>
{% endif %}
