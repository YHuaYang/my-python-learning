# Nginx 站点配置
#
# 安装位置：/etc/nginx/sites-available/mysite
# 启用：ln -s /etc/nginx/sites-available/mysite /etc/nginx/sites-enabled/
#
# 把 example.com 全部换成你的真实域名。

# 上游：Gunicorn 监听的地址
upstream mysite_app {
    server 127.0.0.1:8000;
}

# HTTP → HTTPS 重定向。
# 先保留 80 端口是为了 Let's Encrypt 的验证能通过
# （它需要从外部访问 /.well-known/acme-challenge/）。
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # 证书续期验证路径。必须放在重定向之前，
    # 否则续期请求会被 301 到 https，验证失败导致证书过期。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # ===== TLS 证书（由 certbot 生成）=====
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # 协议与加密套件：只保留 TLS 1.2/1.3。
    # 1.0 和 1.1 已被主流浏览器弃用，且存在已知漏洞。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # 会话缓存：减少重复握手开销
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling：把证书状态查询结果缓存到服务器，
    # 客户端不必再去 CA 查询，加快握手
    ssl_stapling on;
    ssl_stapling_verify on;

    # ===== 安全响应头 =====
    # 告诉浏览器这个域名一年内只走 HTTPS。
    # 注意：设了就不要轻易撤，撤了用户可能在有效期内连不上。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传大小限制。
    # 必须 ≥ Django 里 MEDIA 相关的限制（编辑器图片 5MB，
    # MAX_UPLOAD_SIZE 20MB），否则请求在 Nginx 层就被拒。
    client_max_body_size 20M;

    # ===== 静态文件（collectstatic 的产物）=====
    # 交给 Nginx 直接读磁盘，不经过 Django。
    # 这是 WhiteNoise 之外的额外一层：Nginx 比 Python 快得多。
    location /static/ {
        alias /var/www/mysite/static/;

        # 文件名带内容哈希（ManifestStaticFilesStorage），
        # 所以可以设长期缓存：内容变了文件名就变，不会拿到旧文件。
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===== 媒体文件（用户上传）=====
    # 这是必须由 Nginx 处理的：Django 的 static() 只在 DEBUG=True
    # 时生效，生产环境不配这段，所有上传的图片都会 404。
    location /media/ {
        alias /var/www/mysite/media/;

        # 不做长期缓存：用户可能替换同名文件（比如换头像）。
        # 7 天是个折中值。
        expires 7d;
        add_header Cache-Control "public";

        # 禁止执行目录里的脚本。
        # 虽然上传接口已经拦了非图片，但多一层防护更安全：
        # 万一有人想办法传了 .php 或 .py，这里也不会执行。
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # ===== 转发给 Django =====
    location / {
        proxy_pass http://mysite_app;

        # 让 Django 拿到真实客户端信息。
        # 不传这几个头，Django 看到的全是 127.0.0.1，
        # 限流（按 IP）会失效，日志也没法排查。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 告诉 Django 原始请求是 HTTPS。
        # settings.py 的 SECURE_PROXY_SSL_HEADER 靠这个判断，
        # 缺了会导致 SECURE_SSL_REDIRECT 无限重定向。
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置：与 Gunicorn 的 timeout 保持一致
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 缓冲：让 Nginx 先收完请求体再交给 Gunicorn，
        # 避免慢客户端占住 worker
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 禁止访问隐藏文件（.git、.env 等）。
    # 注意：项目根不应该在 Nginx 的 root 下，
    # 这条是额外保险。
    location ~ /\. {
        deny all;
    }

    # 日志
    access_log /var/log/nginx/mysite.access.log;
    error_log /var/log/nginx/mysite.error.log;
}
