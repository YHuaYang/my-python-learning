# Nginx 配置 —— 未备案阶段（只用 IP 访问，无 HTTPS）
#
# 适用：域名还没备案，只能用 http://服务器IP/ 访问。
#
# 安装：
#   sudo cp deploy/nginx-ip.conf /etc/nginx/sites-available/mysite
#   sudo ln -sf /etc/nginx/sites-available/mysite /etc/nginx/sites-enabled/mysite
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 备案下来后换成 deploy/nginx.conf（带 HTTPS 的完整版）。

server {
    listen 80;
    listen [::]:80;

    # 用 _ 作为默认站点，接受任何 Host 头。
    # 为什么不用具体 IP：公网 IP 可能变（重装、换弹性 IP），
    # 写死会导致配置失效。Django 侧的 ALLOWED_HOSTS 才是真正的白名单。
    server_name _;

    # 上传大小限制。
    # 必须 ≥ Django 的 MAX_UPLOAD_SIZE（20MB），
    # 否则大文件在 Nginx 层就被拒，Django 根本收不到。
    client_max_body_size 20M;

    # ===== 静态文件（collectstatic 的产物）=====
    # 文件名带内容哈希，可以设长期缓存：内容变了文件名就变
    location /static/ {
        alias /var/www/mysite/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== 媒体文件（用户上传）=====
    # 这段不能少：Django 的 static() 只在 DEBUG=True 时生效，
    # 生产环境不配这里，所有上传的图片都会 404。
    location /media/ {
        alias /var/www/mysite/media/;
        # 不设长期缓存：用户可能替换同名文件（比如换头像）
        expires 7d;
        add_header Cache-Control "public";
    }

    # ===== 转发给 Gunicorn =====
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 即使现在是 HTTP，也把协议传过去。
        # 以后加 HTTPS 时 Django 的 SECURE_PROXY_SSL_HEADER 靠这个判断，
        # 不传会导致 SECURE_SSL_REDIRECT 无限重定向。
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    access_log /var/log/nginx/mysite.access.log;
    error_log /var/log/nginx/mysite.error.log;
}
